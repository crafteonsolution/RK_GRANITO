<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 420'>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Logo Squares -->
  <rect x='435' y='40' width='60' height='60' rx='2' fill='#db0000'/>
  <rect x='505' y='40' width='60' height='60' rx='2' fill='#db0000'/>
  <rect x='420' y='110' width='60' height='60' rx='2' fill='#db0000'/>
  <rect x='490' y='110' width='60' height='60' rx='2' fill='#eeeeee'/>
  
  <!-- RK GRANITO Text -->
  <text x='500' y='270' text-anchor='middle' font-size='110' font-weight='900' font-family='Arial Black, sans-serif' fill='#db0000' filter="url(#shadow)" style='letter-spacing: -2px;'>RK GRANITO</text>
  
  <!-- Tagline -->
  <text x='500' y='335' text-anchor='middle' font-size='38' font-family='Segoe UI, Arial, sans-serif' fill='#999999' style='letter-spacing: 1px;'>— Premium Porcelain &amp; Vitrified Surfaces —</text>
</svg>

